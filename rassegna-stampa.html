<body>
<div id="site-header"></div>
<main id="contenuto">

<section class="testata testata--pattern">
  <div class="contenitore">
    <span class="badge">Dicono di noi</span>
    <h1>Rassegna stampa</h1>
    <p>Gli articoli che raccontano ClassLab, le scuole e gli studenti che fanno scienza insieme.</p>
  </div>
</section>
<section class="sezione">
  <div class="contenitore">
    <div class="rs-griglia" id="rs-archivio" aria-live="polite"><p class="rs-vuoto">Caricamento…</p></div>
    <noscript><p class="rs-vuoto">Per vedere la rassegna stampa serve JavaScript.</p></noscript>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="assets/js/config.js?v=b07b4d15"></script>
<script src="assets/js/partner-dati.js?v=adf24b54"></script>
<script src="assets/js/laboratori-dati.js?v=8ffe1dc9"></script>
<script src="assets/js/main.js?v=488f1cb3"></script>
<script src="assets/js/rassegna.js?v=fef6dbd9"></script>
<script>
(function () {
  var box = document.getElementById("rs-archivio");
  function msg(t) { box.innerHTML = '<p class="rs-vuoto">' + t + "</p>"; }
  Rassegna.leggi({ azione: "elenco" }).then(function (lista) {
    lista = (lista || []).slice().sort(Rassegna.perData);
    if (!lista.length) return msg("Nessuna rassegna pubblicata per ora. Torna presto a trovarci!");
    box.innerHTML = lista.map(Rassegna.scheda).join("");
  }, function (e) {
    msg(e.message === "non-configurato" ? "La rassegna stampa sarà presto disponibile." : "Non riusciamo a caricare le rassegne in questo momento. Riprova tra poco.");
  });
})();
</script>
</body>
