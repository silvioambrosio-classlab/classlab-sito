<script>
(function () {
  var cont = document.getElementById("rs-contenuto"), stato = document.getElementById("rs-stato");
  var slug = new URLSearchParams(location.search).get("r") || "";
  function messaggio(t, errore) { stato.textContent = t; stato.className = "rs-stato" + (errore ? " rs-stato--errore" : ""); stato.hidden = false; }
  function meta(sel, attr, val) { var el = document.querySelector(sel); if (el) el.setAttribute(attr, val); }
  function nonTrovata() {
    var m = document.createElement("meta"); m.name = "robots"; m.content = "noindex"; document.head.appendChild(m);
    messaggio("Rassegna non trovata. Potrebbe essere stata rimossa.", true);
  }
  // Titolo, descrizione e dati per i motori di ricerca, impostati in base alla rassegna
  function seo(r) {
    var titolo = r.titolo + " | Rassegna stampa | ClassLab ODV";
    var descr = Rassegna.breve(r.introduzione, 155) || "Gli articoli che raccontano ClassLab ODV.";
    var url = "https://www.classlab.it/rassegna-stampa/rassegna.html?r=" + encodeURIComponent(slug);
    var img = Rassegna.immagineSicura(r.copertina_url);
    document.title = titolo;
    meta('meta[name="description"]', "content", descr);
    meta('link[rel="canonical"]', "href", url);
    meta('meta[property="og:title"]', "content", titolo);
    meta('meta[property="og:description"]', "content", descr);
    meta('meta[property="og:url"]', "content", url);
    if (img) meta('meta[property="og:image"]', "content", img);
    var ld = document.createElement("script"); ld.type = "application/ld+json";
    ld.textContent = JSON.stringify({ "@context": "https://schema.org", "@type": "CollectionPage", name: r.titolo, description: descr, url: url,
      datePublished: r.data, inLanguage: "it", publisher: { "@type": "Organization", name: "ClassLab ODV", url: "https://www.classlab.it/" } });
    document.head.appendChild(ld);
  }
  if (!slug) { nonTrovata(); return; }
  Rassegna.leggi({ fn: "pubblica", slug: slug }).then(function (r) {
    cont.innerHTML = Rassegna.contenuto(r);
    stato.hidden = true;
    seo(r);
  }, function (e) {
    if (e.nonConfigurato) messaggio("La rassegna stampa sarà presto disponibile.");
    else if (/non trovata/i.test(e.message)) nonTrovata();
    else messaggio("Non riusciamo a caricare la rassegna. Riprova tra qualche minuto.", true);
  });
})();
</script>
</body>
