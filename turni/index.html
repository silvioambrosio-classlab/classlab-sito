<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turni ClassLab</title>
<meta name="theme-color" content="#2f6fde">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icona-32.png?v=2">
<link rel="apple-touch-icon" href="icona-180.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turni">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#6b7385; --line:#e4e7ec;
    --accent:#2f6fde; --accent-soft:#e8f0fd;
    --team:#b7e1cd; --team-ink:#155a3a; --fsl:#ead1dc; --fsl-ink:#7a2f52;
    --aff:#ff9900; --aff-soft:#fff1dc; --aff-ink:#8a4b00;
    --free-ink:#2f6fde; --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  header.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
  .wrap{max-width:980px;margin:0 auto;padding:0 16px}
  .bar{display:flex;align-items:center;gap:12px;padding:12px 0}
  .bar h1{font-size:18px;margin:0;flex:1}
  .bar-logo{height:36px;width:auto;flex-shrink:0}
  @media (max-width:560px){.bar{gap:8px}.bar h1{font-size:17px;white-space:nowrap;flex:1 0 auto}.h1-extra{display:none}#materia{flex:0 1 auto;min-width:0;max-width:150px;font-size:14px;padding:6px}.bar .btn{padding:5px 8px}.who{font-size:12px}.installa-t{display:none}}
  @media (max-width:350px){.bar h1{font-size:0}}
  .bar h1 small{color:var(--muted);font-weight:500;margin-left:6px}
  .who{font-size:13px;color:var(--muted);text-align:right}
  .who b{color:var(--ink)}
  .tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
  .tab{border:0;background:none;padding:10px 12px;font:inherit;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .tab .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--line);color:var(--ink);font-size:12px;margin-left:4px}
  .tab .n.warn{background:var(--aff);color:#fff}
  main.wrap{padding-top:18px;padding-bottom:60px}
  .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  select,input,button{font:inherit}
  select,input[type=text],input[type=date],input[type=number]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  label.chk{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
  .btn:hover{border-color:#c9ced8}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.small{padding:3px 9px;font-size:13px}
  .btn.ghost{border-color:transparent;background:none;color:var(--muted)}
  .btn.danger{color:#b42318}
  .month{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:600}
  .day{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
  .day.past{opacity:.55}
  .glist .grow{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:6px}
  .glist .grow.resched{background:#f3f4f6;border-style:dashed}
  .glist .grow.past{opacity:.55}
  .glist .labs{color:var(--muted);font-size:13px;margin-top:2px}
  .glist .ga{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .modal .fasce{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .modal .warn{background:var(--aff-soft);color:var(--aff-ink);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  #login .card{background:#fff;border:1px solid var(--line);border-radius:20px;max-width:400px;width:100%;padding:32px 24px;text-align:center}
  #login img{width:auto;height:96px;display:block;margin:0 auto}
  #login h1{font-size:24px;margin:14px 0 6px}
  #login p{color:var(--muted);margin:0 0 22px;line-height:1.45}
  #gbtn{display:flex;justify-content:center;min-height:44px}
  #loginErr{color:#b42318;font-size:14px;margin-top:14px;min-height:1em}
  .hidden{display:none !important}
  @media (max-width:640px){ .glist .grow{grid-template-columns:1fr} .glist .ga{justify-content:flex-start} }
  .day.resched{background:#f3f4f6;border-style:dashed}
  .day.resched .turni{opacity:.55}
  .tag.resched{background:#fde8e8;color:#b42318;font-weight:600}
  .day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .day-h{display:flex;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .date{width:54px;text-align:center;flex:none;line-height:1.1}
  .date .dow{font-size:12px;color:var(--muted);text-transform:uppercase}
  .date .d{font-size:24px;font-weight:700}
  .date .m{font-size:12px;color:var(--muted);text-transform:uppercase}
  .day-h .t{flex:1;min-width:0}
  .day-h h3{margin:0;font-size:16px}
  .nota{margin:2px 0 0;font-size:13px;color:var(--aff-ink)}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--line);color:var(--ink)}
  .tag.free{background:var(--accent-soft);color:var(--free-ink)}
  .tag.mat-bio{background:#e3ecfb;color:#1e4fa8}
  .tag.mat-fisica{background:#e2f1dc;color:#2e6b1f}
  #materia{padding:5px 8px;border-radius:8px}
  .tag.aff{background:var(--aff-soft);color:var(--aff-ink)}
  .turni{display:grid}
  .turno{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
  .turno:first-child{border-top:0}
  .turno.mine{background:#f3faf6}
  .ora{font-variant-numeric:tabular-nums;font-weight:600}
  .classe b{font-weight:600}
  .classe .labs{color:var(--muted);font-size:13px}
  .posti{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:16px;font-size:13px;border:1px solid transparent;white-space:nowrap}
  .chip.team{background:var(--team);color:var(--team-ink)}
  .chip.fsl{background:var(--fsl);color:var(--fsl-ink)}
  .chip.aff{background:var(--aff-soft);color:var(--aff-ink);border-color:var(--aff)}
  .chip.free{background:#fff;color:var(--free-ink);border:1px dashed var(--free-ink)}
  .chip.altro{background:#eee;color:#444}
  .chip.me{font-weight:700;box-shadow:inset 0 0 0 2px var(--team-ink)}
  .chip button{border:0;background:rgba(255,255,255,.85);border-radius:10px;padding:1px 8px;font-size:12px;cursor:pointer;color:inherit;font-weight:600}
  .chip.edit{cursor:pointer}
  .chip.edit:hover{filter:brightness(.95)}
  .editable{cursor:pointer;border-bottom:1px dashed #b5bccb}
  .empty{padding:40px 16px;text-align:center;color:var(--muted)}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
  .stat .v{font-size:22px;font-weight:700}
  .stat .l{font-size:13px;color:var(--muted)}
  .legend{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:8px 0 0}
  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
  .panel h2{font-size:15px;margin:0 0 10px}
  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
  .form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
  .hint{font-size:13px;color:var(--muted);margin:8px 0 0}
  .modal-bg{position:fixed;inset:0;background:rgba(20,25,35,.4);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
  [hidden]{display:none!important}
  .installa{display:inline-flex;align-items:center;gap:4px}
  .login-installa{margin:18px 0 0}
  .guida ol{padding-left:20px;margin:8px 0}.guida li{margin:6px 0}.guida .ico-share{display:inline-block;vertical-align:-3px}
  .modal{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:420px}
  .modal h3{margin:0 0 12px;font-size:16px}
  .modal .row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13px;color:var(--muted)}
  .modal .row input,.modal .row select{width:100%}
  .modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1d2330;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:30;max-width:90vw}
  #toast.err{background:#b42318}
  #busy{position:fixed;top:0;left:0;right:0;height:3px;background:var(--accent);display:none;z-index:40;animation:b 1s infinite linear}
  @keyframes b{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
  /* selettore Turni | Checklist (solo livelli abilitati alla checklist) */
  .vista{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;margin:0 0 8px;width:max-content;max-width:100%}
  .vista button{border:0;background:none;border-radius:999px;padding:6px 16px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .vista button.on{background:var(--accent);color:#fff;font-weight:600}
  .vista button .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--aff);color:#fff;font-size:11px;text-align:center}
  #checklist{display:block;width:100%;border:0;background:#f6f9fc}
  body.in-checklist{overflow:hidden}
  body.in-checklist #tabs,body.in-checklist #main,body.in-checklist #materia,body.in-checklist #reload{display:none!important}
  /* modulo "Nuova giornata" */
  .modal.wide{max-width:680px;max-height:calc(100vh - 32px);overflow:auto}
  .ng-lb{font-size:13px;color:var(--muted);margin:0 0 5px}
  .ng-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .ng-grid input,.ng-grid select{width:100%}
  .ng-chips{display:flex;flex-wrap:wrap;gap:5px}
  .ng-ch{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;border:1px solid #c9ced8;background:#fff;font-size:13px;cursor:pointer;user-select:none;color:var(--ink)}
  .ng-ch.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .ng-ch .n{font-size:11px;background:var(--accent);color:#fff;border-radius:999px;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center}
  .ng-fx{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
  .ng-fh{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ng-tm{display:flex;align-items:center;gap:4px}
  .ng-tm input{width:100px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
  .ng-tm button{width:30px;height:30px;padding:0}
  .ng-cls{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:#fff}
  .ng-cls.man{border-color:var(--aff)}
  .ng-cls input[type=text]{width:100%}
  .ng-del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 4px}
  .ng-lnk{border:0;background:none;color:var(--accent);cursor:pointer;font-size:13px;padding:2px 0}
  .ng-bdg{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--aff-soft);color:var(--aff-ink)}
  .ng-av{font-size:13px;color:var(--aff-ink);margin:6px 0 0}
  .ng-err{font-size:13px;color:#b42318;margin:6px 0 0}
  @media (max-width:640px){
    .turno{grid-template-columns:1fr;gap:6px}
    .posti{justify-content:flex-start}
    .who{display:none}
  }
</style>
</head>
<body>
<div id="busy"></div>
<section id="login">
  <div class="card">
    <img src="../assets/img/logo-classlab-300.webp" alt="ClassLab">
    <h1>Turni ClassLab</h1>
    <p>Accedi con il tuo account Google <b>@classlab.it</b> per vedere e gestire i turni.</p>
    <div id="gbtn"></div>
    <p class="login-installa" hidden><button class="btn small" data-installa>Aggiungi alla schermata Home</button></p>
    <div id="loginErr"></div>
  </div>
</section>
<div id="app" class="hidden">
<header class="top">
  <div class="wrap">
    <div class="bar">
      <img class="bar-logo" src="../assets/img/logo-classlab-150.webp" alt="ClassLab" width="150" height="163">
      <h1>Turni<span class="h1-extra"> ClassLab</span></h1>
      <select id="materia" title="Materia"></select>
      <div class="who" id="who"></div>
      <button class="btn small installa" data-installa title="Aggiungi alla schermata Home" aria-label="Aggiungi alla schermata Home" hidden><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 7v7M9 11l3 3 3-3"/></svg><span class="installa-t"> Installa</span></button>
      <button class="btn small" id="reload" title="Ricarica dal foglio">Aggiorna</button>
      <button class="btn small ghost" id="logout" title="Esci">Esci</button>
    </div>
    <nav class="vista" id="vista" aria-label="Sezione" hidden>
      <button type="button" data-vista="turni" class="on">Turni</button>
      <button type="button" data-vista="checklist">Checklist materiali</button>
    </nav>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="empty">Caricamento dei turni…</div></main>
<iframe id="checklist" title="Checklist materiali" hidden></iframe>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="../assets/js/team-auth.js?v=bba1f888"></script>
<script src="../assets/js/area-team-dati.js?v=dd0b38e1"></script>
<script>
/* ---------- configurazione: i valori sono in config.js ---------- */
const API_URL = (window.TURNI_CONFIG || {}).API_URL;

const S = { dati:null, tab:'miei', persona:'', passate:false, gestione:false, materia:'', vista:'turni', livello:undefined };
const GIORNI = ['dom','lun','mar','mer','gio','ven','sab'];
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const oggi = (() => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); })();

/* ---------- login e server: vedi ../assets/js/team-auth.js ---------- */
function mostraLogin(msg){
  S.token = null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('loginErr').textContent = msg || '';
}
function onAccesso(p, tok){
  S.token = tok;
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  carica();
  ricaricaChecklist(); // dopo un nuovo accesso la checklist riparte con la sessione nuova
}
function esci(){ TeamAuth.esci(); }
function avviaLogin(){
  TeamAuth.avvia({
    api: API_URL, bottone: 'gbtn', onLogin: mostraLogin, onAccesso: onAccesso,
    onBusy: on => { document.getElementById('busy').style.display = on ? 'block' : 'none'; }
  });
}
const call = (fn, ...args) => TeamAuth.chiama(fn, ...args);
async function carica(){
  try { S.dati = await call('getDati'); render(); controllaChecklist(); }
  catch(e){ toast(e.message, true); document.getElementById('main').innerHTML = '<div class="empty">Impossibile caricare i turni: '+esc(e.message)+'</div>'; }
}
async function azione(fn, args, msg){
  try { S.dati = await call(fn, ...args); render(); if (msg) toast(msg); }
  catch(e){ toast(e.message, true); if (S.token) carica(); }
}

/* ---------- checklist materiali dentro l'app (solo livelli abilitati) ----------
   I livelli che vedono la checklist sono quelli della scheda "Checklist materiali"
   in ../assets/js/area-team-dati.js (oggi 1 e 2): si cambiano solo lì.
   Gli altri utenti non vedono nessuna differenza. Il controllo vero resta nello script dei materiali. */
function livelliChecklist(){
  const v = (window.AREA_TEAM || []).find(x => /\/materiali\/?$/.test(x.link || ''));
  return v && v.livelli && v.livelli.length ? v.livelli.map(Number) : [1, 2];
}
function puoChecklist(){
  const liv = Number(S.livello || (S.dati && S.dati.utente && S.dati.utente.livello));
  if (liv) return livelliChecklist().includes(liv);
  return !!(S.dati && S.dati.utente && S.dati.utente.organizzatore); // server senza "chiSono": solo organizzatori
}
async function controllaChecklist(){
  if (S.livello === undefined){
    S.livello = null;
    try { const io = await call('chiSono'); S.livello = io && io.livello ? Number(io.livello) : null; } catch(e){ S.livello = null; }
  }
  const ok = puoChecklist();
  document.getElementById('vista').hidden = !ok;
  if (!ok){ if (S.vista !== 'turni') mostraVista('turni'); return; }
  let salvata = ''; try { salvata = localStorage.getItem('turniVista') || ''; } catch(e){}
  if (location.hash === '#checklist') salvata = 'checklist';
  if (salvata === 'checklist' && S.vista !== 'checklist') mostraVista('checklist');
}
function mostraVista(v){
  if (v === 'checklist' && !puoChecklist()) v = 'turni';
  S.vista = v;
  try { localStorage.setItem('turniVista', v); } catch(e){}
  document.querySelectorAll('#vista [data-vista]').forEach(b => b.classList.toggle('on', b.dataset.vista === v));
  const fr = document.getElementById('checklist');
  document.body.classList.toggle('in-checklist', v === 'checklist');
  fr.hidden = v !== 'checklist';
  if (v === 'checklist'){
    if (!fr.getAttribute('src')) fr.src = '../materiali/?incorporata=1';
    else try { fr.contentWindow.postMessage({ classlab: 'aggiorna' }, location.origin); } catch(e){}
    misuraChecklist();
  }
  window.scrollTo(0, 0);
}
function misuraChecklist(){
  const fr = document.getElementById('checklist');
  if (fr.hidden) return;
  const h = document.querySelector('header.top').offsetHeight;
  fr.style.height = Math.max(200, window.innerHeight - h) + 'px';
}
function ricaricaChecklist(){
  const fr = document.getElementById('checklist');
  if (fr.getAttribute('src')) fr.src = '../materiali/?incorporata=1&t=' + Date.now();
}
window.addEventListener('resize', misuraChecklist);
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || e.data.classlab !== 'accesso') return;
  // la sessione è scaduta mentre si usava la checklist: si rientra dalla schermata dell'app
  mostraLogin('Sessione scaduta: accedi di nuovo.');
  try { google.accounts.id.prompt(); } catch(err){}
});

/* ---------- utilità ---------- */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(t, err){ const el = document.getElementById('toast'); el.textContent = t; el.className = err ? 'err' : ''; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display='none', err ? 6000 : 3000); }
function me(){ return S.dati && S.dati.utente.nome; }
function eqNome(a,b){ return String(a||'').trim().toLowerCase() === String(b||'').trim().toLowerCase(); }
function dataObj(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function minuti(orario){
  const m = /^\s*(\d{1,2})(?:[:.](\d{1,2}))?\s*-\s*(\d{1,2})(?:[:.](\d{1,2}))?/.exec(orario||'');
  if (!m) return null;
  return [ +m[1]*60 + +(m[2]||0), +m[3]*60 + +(m[4]||0) ];
}
function haPersona(t, nome){ return t.posti.some(p => p.persone.some(x => eqNome(x, nome))); }
function liberi(t){ return t.posti.filter(p => p.libero && p.tipo !== 'affiancare'); }
function daAffiancare(t){ return t.posti.filter(p => p.tipo === 'affiancare'); }
function futura(g){ return g.data >= oggi; }
function attiva(g){ return futura(g) && !g.riprogrammare; }
function tuttiTurni(){ return S.dati.giornate.flatMap(g => g.turni.map(t => ({g, t}))); }
function giornateVis(){ return S.dati.giornate.filter(g => !S.materia || g.materia === S.materia); }
function turniVis(){ return giornateVis().flatMap(g => g.turni.map(t => ({g, t}))); }
function nomeMateria(id){ const m = (S.dati.materie||[]).find(x => x.id === id); return m ? m.nome : id; }

/* ---------- render ---------- */
function render(){
  const d = S.dati, u = d.utente;
  document.getElementById('who').innerHTML = u.nome
    ? 'Ciao <b>'+esc(u.nome)+'</b>' + (u.organizzatore ? ' · organizzatore' : u.solaLettura ? ' · sola visualizzazione' : '')
    : esc(u.email || 'Account non riconosciuto');

  const selM = document.getElementById('materia');
  selM.innerHTML = '<option value="">' + (innerWidth < 560 ? 'Tutte' : 'Tutte le materie') + '</option>' + (d.materie||[]).map(m => `<option value="${m.id}" ${S.materia===m.id?'selected':''}>${esc(m.nome)}</option>`).join('');
  const futuri = turniVis().filter(x => attiva(x.g));
  const nMiei = u.nome ? futuri.filter(x => haPersona(x.t, u.nome)).length : 0;
  const nLib = futuri.reduce((s,x) => s + liberi(x.t).length, 0);
  const nAff = futuri.reduce((s,x) => s + daAffiancare(x.t).length, 0);

  const tabs = [
    u.nome && ['miei','I miei turni', nMiei, ''],
    ['cal','Calendario', null, ''],
    ['liberi','Posti liberi', nLib, ''],
    ['aff','Affiancamenti', nAff, nAff ? 'warn' : ''],
    u.organizzatore && ['giorn','Giornate', null, ''],
    u.organizzatore && ['gest','Gestione', null, ''],
  ].filter(Boolean);
  if (!tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];
  document.getElementById('tabs').innerHTML = tabs.map(([id,l,n,cls]) =>
    `<button class="tab ${S.tab===id?'on':''}" data-tab="${id}">${l}${n!==null?` <span class="n ${cls}">${n}</span>`:''}</button>`).join('');

  const main = document.getElementById('main');
  S.gestione = S.tab === 'gest';
  if (S.tab === 'miei') main.innerHTML = viewMiei();
  else if (S.tab === 'cal') main.innerHTML = viewCalendario();
  else if (S.tab === 'liberi') main.innerHTML = viewFiltro(t => liberi(t).length > 0, 'Nessun posto libero nelle prossime giornate.', 'Turni in cui serve ancora qualcuno del team. Premi "Prendo io" per segnarti: il foglio si aggiorna subito.');
  else if (S.tab === 'aff') main.innerHTML = viewFiltro(t => daAffiancare(t).length > 0, 'Nessuno studente FSL da affiancare.', 'Studenti FSL alla prima uscita: serve uno di noi in più che li affianchi.');
  else if (S.tab === 'gest') main.innerHTML = viewGestione();
  else if (S.tab === 'giorn') main.innerHTML = viewGiornate();
}

function viewMiei(){
  const n = me();
  const tutti = turniVis().filter(x => haPersona(x.t, n));
  const fut = tutti.filter(x => attiva(x.g));
  const nRip = tutti.filter(x => futura(x.g) && x.g.riprogrammare).length;
  const prossimo = fut[0];
  const giorni = new Set(fut.map(x => x.g.data)).size;
  let h = `<div class="summary">
    <div class="stat"><div class="v">${fut.length}</div><div class="l">turni in programma</div></div>
    <div class="stat"><div class="v">${giorni}</div><div class="l">giornate</div></div>
    <div class="stat"><div class="v">${prossimo ? esc(dataBreve(prossimo.g.data)) : '–'}</div><div class="l">${prossimo ? esc(prossimo.g.scuola)+', '+esc(prossimo.t.orario) : 'nessun prossimo turno'}</div></div>
    <div class="stat"><div class="v">${nRip}</div><div class="l">da riprogrammare</div></div>
  </div>`;
  const conflitti = trovaConflitti(n);
  if (conflitti.length) h += `<div class="panel" style="border-color:var(--aff)"><h2>Attenzione: turni sovrapposti</h2>${conflitti.map(c => `<div>${esc(dataLunga(c.data))}: ${esc(c.a)} e ${esc(c.b)}</div>`).join('')}</div>`;
  h += giornateHtml(giornateVis().filter(g => futura(g) || S.passate), t => haPersona(t, n), 'Non hai turni in programma.');
  h += `<div class="tools" style="margin-top:12px"><label class="chk"><input type="checkbox" id="passate" ${S.passate?'checked':''}> Mostra giornate passate</label></div>`;
  return h;
}

function viewCalendario(){
  const team = S.dati.team;
  let h = `<div class="tools">
    <select id="persona"><option value="">Tutto il team</option>${team.map(n => `<option ${eqNome(n,S.persona)?'selected':''}>${esc(n)}</option>`).join('')}</select>
    <label class="chk"><input type="checkbox" id="passate" ${S.passate?'checked':''}> Mostra giornate passate</label>
  </div>`;
  h += legenda();
  const filtro = S.persona ? (t => haPersona(t, S.persona)) : null;
  h += giornateHtml(giornateVis().filter(g => futura(g) || S.passate), filtro, 'Nessuna giornata.');
  return h;
}

function viewFiltro(fn, vuoto, intro){
  return `<p class="hint" style="margin:0 0 12px">${intro}</p>` + giornateHtml(giornateVis().filter(attiva), fn, vuoto);
}

function viewGestione(){
  let h = `<div class="tools">
    <label class="chk"><input type="checkbox" id="passate" ${S.passate?'checked':''}> Mostra giornate passate</label>
    ${(S.dati.materie||[]).filter(m => m.url && (!S.materia || S.materia===m.id)).map(m => `<a class="btn small" href="${esc(m.url)}" target="_blank">Apri foglio ${esc(m.nome)}</a>`).join('')}
  </div>
  <p class="hint" style="margin:0 0 12px">Tocca un nome, un orario o una classe per modificarli; "+ persona" riempie una cella vuota. Date, fasce orarie e numero di classi si cambiano dal menu <b>Giornate</b>.</p>`;
  h += giornateHtml(giornateVis().filter(g => futura(g) || S.passate), null, 'Nessuna giornata.');
  return h;
}

function viewGiornate(){
  let h = `<div class="panel"><h2>Nuova giornata</h2>
    <button class="btn primary" id="nApri">+ Nuova giornata</button>
    <p class="hint">Scegli scuola, fasce orarie, classi ed esperimenti: la giornata viene inserita nel foglio al posto giusto per data, con la formattazione del foglio e un posto "C" per ogni classe.</p>
  </div>
  <div class="tools"><label class="chk"><input type="checkbox" id="passate" ${S.passate?'checked':''}> Mostra giornate passate</label></div>`;
  const lista = giornateVis().filter(g => futura(g) || S.passate);
  if (!lista.length) return h + '<div class="empty">Nessuna giornata.</div>';
  let mese = '';
  h += '<div class="glist">';
  for (const g of lista){
    const m = g.data.slice(0,7);
    if (m !== mese){ mese = m; const d = dataObj(g.data); h += `<div class="month">${MESI[d.getMonth()]} ${d.getFullYear()}</div>`; }
    const d = dataObj(g.data);
    const orari = [...new Set(g.turni.map(t => t.orario))].sort((a,b) => (minuti(a)||[0])[0] - (minuti(b)||[0])[0]);
    const nClassi = new Set(g.turni.map(t => t.riga)).size;
    h += `<div class="grow ${g.riprogrammare?'resched':''} ${g.data<oggi?'past':''}">
      <div class="gd"><b>${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()].slice(0,3)}</b></div>
      <div class="gs"><b>${esc(g.scuola)}</b> ${!S.materia ? `<span class="tag mat-${esc(g.materia)}">${esc(nomeMateria(g.materia))}</span>` : ''} ${g.riprogrammare ? '<span class="tag resched">Da riprogrammare</span>' : ''}
        <div class="labs">${orari.map(esc).join(' · ') || 'nessuna fascia'} — ${nClassi} ${nClassi===1?'classe':'classi'} per fascia</div></div>
      <div class="ga">
        <button class="btn small" data-modg="${g.materia}|${g.riga}">Modifica</button>
        <button class="btn small ${g.riprogrammare?'':'ghost'}" data-riprog="${g.materia}|${g.riga}|${g.riprogrammare?0:1}">${g.riprogrammare ? 'Togli «da riprogrammare»' : 'Da riprogrammare'}</button>
      </div>
    </div>`;
  }
  return h + '</div>';
}

function legenda(){
  return `<div class="legend" style="margin-bottom:12px">
    <span class="chip team">Team</span><span class="chip fsl">Studente FSL</span>
    <span class="chip aff">Da affiancare</span><span class="chip free">Posto libero</span></div>`;
}

function giornateHtml(giornate, filtroTurno, vuoto){
  let h = '', mese = '';
  for (const g of giornate){
    const turni = filtroTurno ? g.turni.filter(filtroTurno) : g.turni;
    if (filtroTurno && !turni.length) continue;
    const m = g.data.slice(0,7);
    if (m !== mese){ mese = m; const d = dataObj(g.data); h += `<div class="month">${MESI[d.getMonth()]} ${d.getFullYear()}</div>`; }
    h += giornataHtml(g, turni);
  }
  return h || `<div class="empty">${vuoto}</div>`;
}

function giornataHtml(g, turni){
  const d = dataObj(g.data), G = S.gestione;
  const nLib = g.turni.reduce((s,t) => s + liberi(t).length, 0);
  const nAff = g.turni.reduce((s,t) => s + daAffiancare(t).length, 0);
  const ordinati = turni.slice().sort((a,b) => (minuti(a.orario)||[0])[0] - (minuti(b.orario)||[0])[0] || a.riga - b.riga);
  return `<article class="day ${g.data<oggi?'past':''} ${g.data===oggi?'today':''} ${g.riprogrammare?'resched':''}">
    <div class="day-h">
      <div class="date"><div class="dow">${GIORNI[d.getDay()]}</div><div class="d">${d.getDate()}</div><div class="m">${MESI[d.getMonth()].slice(0,3)}</div></div>
      <div class="t">
        <h3>${G ? `<span class="editable" data-txt="${g.materia}|${g.riga}|2|${esc(g.scuola)}|Scuola">${esc(g.scuola)}</span>` : esc(g.scuola)}</h3>
        ${g.nota ? `<p class="nota">${esc(g.nota)}</p>` : ''}
      </div>
      <div class="tags">
        ${!S.materia ? `<span class="tag mat-${esc(g.materia)}">${esc(nomeMateria(g.materia))}</span>` : ''}
        ${g.riprogrammare ? `<span class="tag resched">Da riprogrammare</span>` : ''}
        ${nLib && !g.riprogrammare ? `<span class="tag free">${nLib} ${nLib===1?'posto libero':'posti liberi'}</span>` : ''}
        ${nAff && !g.riprogrammare ? `<span class="tag aff">${nAff} da affiancare</span>` : ''}
        ${G ? `<button class="btn small" data-coppia="${g.materia}|${g.riga}">+ classe</button>` : ''}
      </div>
    </div>
    <div class="turni">${ordinati.map(t => turnoHtml(g, t)).join('')}</div>
  </article>`;
}

function turnoHtml(g, t){
  const G = S.gestione, n = me();
  const mio = n && haPersona(t, n);
  const [cls, ...rest] = t.classe.split(':');
  const classe = t.classe
    ? (rest.length ? `<b>${esc(cls.trim())}</b> <span class="labs">${esc(rest.join(':').trim().replace(/\s*-\s*/g,' · '))}</span>` : esc(t.classe))
    : '<span class="labs">classe non indicata</span>';
  const ora = G ? `<span class="editable" data-txt="${g.materia}|${t.rigaOrario}|${t.col}|${esc(t.orario)}|Orario">${esc(t.orario)}</span>` : esc(t.orario);
  const cl = G && t.rigaClasse ? `<span class="editable" data-txt="${g.materia}|${t.rigaClasse}|${t.col}|${esc(t.classe)}|Classe e laboratori">${classe}</span>` : classe;
  return `<div class="turno ${mio?'mine':''}">
    <div class="ora">${ora}</div>
    <div class="classe">${cl}</div>
    <div class="posti">${t.posti.map(p => chipHtml(g, t, p, mio)).join('')}${G ? [t.col, t.col+1].filter(c => !t.posti.some(p => p.col === c)).map(c => `<span class="chip free edit" data-posto="${g.materia}|${t.riga}|${c}||vuoto"> + persona</span>`).join('') : ''}</div>
  </div>`;
}

function chipHtml(g, t, p, mioTurno){
  const n = me(), G = S.gestione;
  const sonoIo = n && p.persone.some(x => eqNome(x, n));
  const key = `${g.materia}|${p.riga}|${p.col}|${esc(p.testo)}|${esc(p.tipo)}`;
  const editAttr = G ? ` data-posto="${key}"` : '';
  const cls = c => `chip ${c} ${sonoIo?'me':''} ${G?'edit':''}`;
  const futuro = futura(g);

  if (p.tipo === 'affiancare'){
    const btn = !G && n && !S.dati.utente.solaLettura && futuro && !g.riprogrammare && !mioTurno ? `<button data-prendi="${key}" data-ora="${esc(t.orario)}" data-day="${g.data}">Affianco io</button>` : '';
    return `<span class="${cls('aff')}"${editAttr}>${esc(p.persone.join(' + ') || 'Studente')} · da affiancare ${btn}</span>`;
  }
  if (p.tipo === 'libero'){
    const altri = p.persone.map(x => esc(x)).join(' + ');
    const btn = !G && n && !S.dati.utente.solaLettura && futuro && !g.riprogrammare && !mioTurno ? `<button data-prendi="${key}" data-ora="${esc(t.orario)}" data-day="${g.data}">Prendo io</button>` : '';
    return `<span class="${cls('free')}"${editAttr}>Posto libero${altri ? ' + '+altri : ''} ${btn}</span>`;
  }
  const c = p.tipo === 'team' ? 'team' : p.tipo === 'fsl' ? 'fsl' : 'altro';
  const lascia = !G && sonoIo && !S.dati.utente.solaLettura && futuro ? `<button data-lascia="${key}" title="Rinuncia al turno">Lascio</button>` : '';
  return `<span class="${cls(c)}"${editAttr}>${esc(p.testo)} ${lascia}</span>`;
}

/* ---------- date ---------- */
function dataBreve(iso){ const d = dataObj(iso); return d.getDate()+' '+MESI[d.getMonth()].slice(0,3); }
function dataLunga(iso){ const d = dataObj(iso); return GIORNI[d.getDay()]+' '+d.getDate()+' '+MESI[d.getMonth()]; }

function trovaConflitti(nome, extra){
  const per = {};
  tuttiTurni().filter(x => attiva(x.g) && haPersona(x.t, nome)).forEach(x => (per[x.g.data] = per[x.g.data] || []).push(x));
  if (extra) (per[extra.g.data] = per[extra.g.data] || []).push(extra);
  const out = [];
  Object.keys(per).forEach(data => {
    const l = per[data];
    for (let i=0;i<l.length;i++) for (let j=i+1;j<l.length;j++){
      const a = minuti(l[i].t.orario), b = minuti(l[j].t.orario);
      if (a && b && a[0] < b[1] && b[0] < a[1]) out.push({data, a: l[i].g.scuola+' '+l[i].t.orario, b: l[j].g.scuola+' '+l[j].t.orario, extra: extra && (l[i]===extra || l[j]===extra)});
    }
  });
  return out;
}

function modalGiornata(mat, riga){
  const g = S.dati.giornate.find(x => x.materia === mat && x.riga === riga);
  if (!g) return;
  const per = {}; g.turni.forEach(t => { per[t.col] = t.orario; });
  const COLS = [3,6,9,12];
  const nClassi = new Set(g.turni.map(t => t.riga)).size || 1;
  apriModal(`<h3>Modifica giornata · ${esc(nomeMateria(g.materia))}</h3>
    <div class="row">Data<input type="date" id="gData" value="${g.data}"></div>
    <div class="row">Scuola<input type="text" id="gScuola" value="${esc(g.scuola)}"></div>
    <div class="row">Fasce orarie (lascia vuota per toglierne una)
      <div class="fasce">${COLS.map((c,i) => `<input type="text" class="gOra" data-i="${i}" value="${esc(per[c]||'')}" placeholder="fascia ${i+1}, es. 10:00-12:00">`).join('')}</div>
    </div>
    <div class="row">Classi per fascia<input type="number" id="gCoppie" min="1" max="6" value="${nClassi}"></div>
    ${g.riprogrammare ? `<label class="chk" style="margin:4px 0"><input type="checkbox" id="gRip" checked> Togli «da riprogrammare»</label>` : ''}
    <div class="warn">Le fasce o le classi tolte devono essere libere (solo "C"). Se cambi la data, la giornata viene spostata nel foglio al punto giusto.</div>
    <div class="acts"><button class="btn ghost" data-close>Annulla</button><button class="btn primary" id="gSave">Salva</button></div>`);
  document.getElementById('gSave').onclick = () => {
    const orari = [...document.querySelectorAll('.gOra')].map(x => x.value.trim());
    const mod = {
      data: document.getElementById('gData').value,
      scuola: document.getElementById('gScuola').value.trim(),
      orari,
      coppie: Number(document.getElementById('gCoppie').value),
      togliRiprogrammare: !!(document.getElementById('gRip') && document.getElementById('gRip').checked),
    };
    if (!mod.data || !mod.scuola){ toast('Data e scuola sono obbligatorie.', true); return; }
    if (!orari.some(Boolean)){ toast('Serve almeno una fascia oraria.', true); return; }
    const tolte = COLS.filter((c,i) => per[c] && !orari[i]).length;
    if ((tolte || mod.coppie < nClassi) && !confirm('Stai togliendo fasce o classi: le righe corrispondenti verranno cancellate dal foglio. Continuo?')) return;
    chiudiModal();
    azione('modificaGiornata', [g.materia, g.riga, g.data, mod], 'Giornata aggiornata');
  };
}

/* ---------- modulo "Nuova giornata" ----------
   Scelte guidate (fasce, anno, sezione, esperimenti) che producono il testo nel formato del foglio,
   "2A: Epiteliali-DNA-Batteri". Per i casi particolari (es. "3+4A") una classe si può scrivere a mano:
   vale solo per quella classe e nessun'altra scelta la modifica. Primaria/secondaria serve solo qui
   (anni 1-5 o 1-3) e non viene scritta nel foglio. */
const NG_ESPERIMENTI = { bio: ['Epiteliali','DNA','Batteri','AIRC','Antibiotici','Digestione','Elettroforesi','Cipolla','Foglie'] };
let NG = null;

const ngMin = t => { const [h,m] = String(t||'').split(':').map(Number); return (h||0)*60 + (m||0); };
const ngOra = n => { n = ((n % 1440) + 1440) % 1440; return String(Math.floor(n/60)).padStart(2,'0') + ':' + String(n%60).padStart(2,'0'); };
const ngNomeBase = s => String(s||'').replace(/\s+[IVX]+$/,'').trim(); // "Dardi V" -> "Dardi"
const ngNuovaClasse = () => ({ anno:'', sez:'', esp:[], man:false, testo:'' });
const ngAnni = () => NG.ordine === 'primaria' ? ['1','2','3','4','5'] : NG.ordine === 'secondaria' ? ['1','2','3'] : [];
const ngTestoGuidato = c => (c.anno && c.sez ? c.anno + c.sez : '?') + ': ' + c.esp.join('-');
const ngTesto = c => c.man ? c.testo.trim() : ngTestoGuidato(c);

function ngScuole(){
  return [...new Set(S.dati.giornate.map(g => g.scuola).filter(Boolean))].sort((a,b) => a.localeCompare(b,'it'));
}
function ngOrdineScuola(scuola){
  const o = (S.dati.ordiniScuole || {})[ngNomeBase(scuola)];
  if (o) return o;
  // classi di 4ª o 5ª già fatte in questa scuola = primaria
  const anni = S.dati.giornate.filter(g => ngNomeBase(g.scuola) === ngNomeBase(scuola))
    .flatMap(g => g.turni.map(t => (/^\s*(\d)/.exec(t.classe) || [])[1])).filter(Boolean);
  return anni.some(a => a === '4' || a === '5') ? 'primaria' : '';
}
function ngEsperimenti(){
  const base = NG_ESPERIMENTI[NG.materia] || [];
  const conta = {};
  S.dati.giornate.filter(g => g.materia === NG.materia).forEach(g => g.turni.forEach(t => {
    const i = t.classe.indexOf(':'); if (i < 0) return;
    t.classe.slice(i+1).split('-').map(s => s.trim()).filter(s => /^[A-Za-zÀ-ÿ ]{3,30}$/.test(s)).forEach(s => {
      const k = base.find(b => b.toLowerCase() === s.toLowerCase()) || s;
      conta[k] = (conta[k] || 0) + 1;
    });
  }));
  // oltre all'elenco base: esperimenti già usati nel foglio almeno 2 volte (es. per Fisica)
  const extra = Object.keys(conta).filter(k => !base.includes(k) && conta[k] >= 2).sort((a,b) => conta[b] - conta[a]);
  return base.concat(extra);
}

function modalNuovaGiornata(){
  const materia = S.materia || ((S.dati.materie||[])[0] || {}).id || 'bio';
  NG = { materia, data:'', scuola:'', altra:false, ordine:'', nota:'', errori:false,
    fasce: [{ s:'08:00', e:'10:00', classi:[ngNuovaClasse()] }, { s:'10:00', e:'12:00', classi:[ngNuovaClasse()] }] };
  apriModal('');
  document.getElementById('modal').classList.add('wide');
  ngRender();
}

function ngCh(testo, on, attr, n){ return `<span class="ng-ch ${on?'on':''}" ${attr}>${n ? `<span class="n">${n}</span>` : ''}${esc(testo)}</span>`; }
function ngTm(i, k, v){
  return `<div class="ng-tm"><button class="btn" data-ng="step" data-i="${i}" data-k="${k}" data-d="-5" aria-label="meno 5 minuti">−</button>`
    + `<input type="time" step="300" value="${v}" data-ngtm="${i}|${k}" aria-label="${k==='s'?'inizio':'fine'}">`
    + `<button class="btn" data-ng="step" data-i="${i}" data-k="${k}" data-d="5" aria-label="più 5 minuti">+</button></div>`;
}

function ngErrori(){
  const e = [];
  if (!NG.data) e.push('Scegli la data.');
  if (!NG.scuola.trim()) e.push('Scegli la scuola.');
  if (!NG.ordine) e.push('Indica se è primaria o secondaria.');
  if (!NG.fasce.some(f => f.classi.length)) e.push('Aggiungi almeno una classe.');
  NG.fasce.forEach(f => {
    if (ngMin(f.e) <= ngMin(f.s)) e.push(`Fascia ${f.s}: la fine deve essere dopo l'inizio.`);
    f.classi.forEach(c => {
      if (c.man){ if (!c.testo.trim()) e.push(`Fascia ${f.s}: una classe scritta a mano è vuota.`); }
      else if (!c.anno || !c.sez || !c.esp.length || !ngAnni().includes(c.anno)) e.push(`Fascia ${f.s}: completa anno, sezione ed esperimenti di ogni classe.`);
    });
  });
  return [...new Set(e)];
}

function ngRender(){
  NG.fasce.sort((a,b) => ngMin(a.s) - ngMin(b.s));
  const scuole = ngScuole();
  const esperimenti = ngEsperimenti();
  let h = `<h3>Nuova giornata</h3>
    <div class="ng-grid">
      <div><p class="ng-lb">Materia</p><div class="ng-chips">${(S.dati.materie||[]).map(m => ngCh(m.nome, NG.materia===m.id, `data-ng="materia" data-v="${m.id}"`)).join('')}</div></div>
      <div><p class="ng-lb">Scuola</p><div class="ng-chips">${ngCh('Primaria (elementari)', NG.ordine==='primaria', 'data-ng="ordine" data-v="primaria"')}${ngCh('Secondaria (medie)', NG.ordine==='secondaria', 'data-ng="ordine" data-v="secondaria"')}</div></div>
      <div><p class="ng-lb">Data</p><input type="date" id="ngData" value="${esc(NG.data)}"></div>
      <div><p class="ng-lb">Istituto</p>
        <select id="ngScuolaSel"><option value="">Scegli…</option>${scuole.map(s => `<option ${!NG.altra && s===NG.scuola?'selected':''}>${esc(s)}</option>`).join('')}<option value="__altra" ${NG.altra?'selected':''}>+ Altra scuola…</option></select>
        ${NG.altra ? `<input type="text" id="ngScuolaTxt" value="${esc(NG.scuola)}" placeholder="Nome della scuola" style="margin-top:6px">` : ''}
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px">
      <p class="ng-lb" style="margin:0">Fasce orarie (max 4, ordinate per inizio)</p>
      ${NG.fasce.length < 4 ? '<span class="ng-ch" data-ng="addFascia">+ Fascia</span>' : ''}
    </div>`;
  NG.fasce.forEach((f, i) => {
    const dur = ngMin(f.e) - ngMin(f.s);
    const sovr = NG.fasce.some((g, j) => j !== i && ngMin(g.s) < ngMin(f.e) && ngMin(f.s) < ngMin(g.e));
    h += `<div class="ng-fx"><div class="ng-fh">${ngTm(i,'s',f.s)}<span style="color:var(--muted)">→</span>${ngTm(i,'e',f.e)}
      <span style="font-size:13px;color:var(--muted)">${dur > 0 ? Math.floor(dur/60) + 'h' + (dur%60 ? String(dur%60).padStart(2,'0') : '') : '—'}</span>
      <span style="flex:1"></span><span class="ng-ch" data-ng="addClasse" data-i="${i}">+ Classe</span>
      ${NG.fasce.length > 1 ? `<button class="ng-del" data-ng="delFascia" data-i="${i}" aria-label="Togli fascia">Togli fascia</button>` : ''}</div>
      ${dur <= 0 ? `<p class="ng-err">La fine deve essere dopo l'inizio.</p>` : ''}
      ${sovr && dur > 0 ? '<p class="ng-av">Si sovrappone a un\'altra fascia: classi in parallelo.</p>' : ''}
      ${!f.classi.length ? '<p class="hint" style="margin-top:6px">Nessuna classe in questa fascia: resterà solo l\'orario.</p>' : ''}`;
    f.classi.forEach((c, k) => {
      const at = `data-i="${i}" data-c="${k}"`;
      if (c.man){
        h += `<div class="ng-cls man"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">
            <span class="ng-bdg">Scritta a mano</span><button class="ng-lnk" data-ng="guidata" ${at}>Torna alla scelta guidata</button>
            <span style="flex:1"></span><button class="ng-del" data-ng="delClasse" ${at}>Togli classe</button></div>
          <input type="text" data-ngtxt="${i}|${k}" value="${esc(c.testo)}" maxlength="120" placeholder="3+4A: Epiteliali-Cipolla-Batteri">
          <p class="hint" style="margin-top:4px">Scritto nel foglio così com'è. Vale solo per questa classe.</p>
          ${NG.errori && !c.testo.trim() ? '<p class="ng-err">Scrivi la classe o torna alla scelta guidata.</p>' : ''}</div>`;
      } else {
        const anni = ngAnni(), fuori = c.anno && anni.length && !anni.includes(c.anno);
        const incompleta = NG.errori && (!c.anno || !c.sez || !c.esp.length || fuori);
        h += `<div class="ng-cls"><div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start">
            <div><p class="ng-lb">Anno</p><div class="ng-chips">${anni.length ? anni.map(a => ngCh(a, c.anno===a, `data-ng="anno" data-v="${a}" ${at}`)).join('') : '<span class="hint" style="margin:0">Prima scegli primaria o secondaria</span>'}</div></div>
            <div><p class="ng-lb">Sezione</p><div class="ng-chips">${'ABCDEFG'.split('').map(s => ngCh(s, c.sez===s, `data-ng="sez" data-v="${s}" ${at}`)).join('')}</div></div>
            <span style="flex:1"></span>
            <div style="display:flex;gap:10px;align-items:center"><button class="ng-lnk" data-ng="mano" ${at}>Scrivi a mano</button><button class="ng-del" data-ng="delClasse" ${at}>Togli classe</button></div></div>
          ${fuori ? `<p class="ng-err">L'anno ${esc(c.anno)} non esiste nella secondaria: sceglilo di nuovo.</p>` : ''}
          <p class="ng-lb" style="margin-top:8px">Esperimenti, in ordine (max 3)</p>
          <div class="ng-chips">${esperimenti.map(x => { const q = c.esp.indexOf(x); return ngCh(x, q >= 0, `data-ng="esp" data-v="${esc(x)}" ${at}`, q >= 0 ? q+1 : 0); }).join('')}</div>
          ${incompleta ? '<p class="ng-err">Completa anno, sezione ed esperimenti, oppure scrivi la classe a mano.</p>' : ''}</div>`;
      }
    });
    h += '</div>';
  });
  h += `<div style="margin-top:12px"><p class="ng-lb">Nota (facoltativa)</p><input type="text" id="ngNota" value="${esc(NG.nota)}" placeholder="Classi piccole unite" style="width:100%"></div>
    ${NG.errori ? ngErrori().map(x => `<p class="ng-err">${esc(x)}</p>`).join('') : ''}
    <div class="acts"><button class="btn ghost" data-close>Annulla</button><button class="btn primary" data-ng="salva" id="ngSalva">Aggiungi giornata</button></div>`;
  const mod = document.getElementById('modal');
  const scroll = mod.scrollTop;
  mod.innerHTML = h;
  mod.scrollTop = scroll;
}

async function ngSalva(){
  NG.errori = true;
  const err = ngErrori();
  if (err.length){ ngRender(); toast(err[0], true); return; }
  const d = {
    materia: NG.materia, data: NG.data, scuola: NG.scuola.trim(), nota: NG.nota.trim(),
    fasce: NG.fasce.map(f => ({ orario: f.s + '-' + f.e, classi: f.classi.map(ngTesto) })),
  };
  const btn = document.getElementById('ngSalva');
  btn.disabled = true; btn.textContent = 'Salvataggio…';
  try {
    S.dati = await call('aggiungiGiornata', d);
    chiudiModal(); render(); toast('Giornata aggiunta');
  } catch(e){
    toast(e.message, true); btn.disabled = false; btn.textContent = 'Aggiungi giornata'; // il modulo resta aperto con i dati inseriti
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-ng]');
  if (!el || !NG) return;
  const a = el.dataset.ng, i = Number(el.dataset.i), k = Number(el.dataset.c), v = el.dataset.v;
  const f = NG.fasce[i], c = f && f.classi[k];
  if (a === 'salva'){ ngSalva(); return; }
  if (a === 'materia'){ NG.materia = v; NG.fasce.forEach(x => x.classi.forEach(y => { if (!y.man) y.esp = []; })); }
  else if (a === 'ordine') NG.ordine = v;
  else if (a === 'addFascia'){ const u = NG.fasce[NG.fasce.length - 1]; const s = u ? u.e : '08:00'; NG.fasce.push({ s, e: ngOra(ngMin(s) + 120), classi:[ngNuovaClasse()] }); }
  else if (a === 'delFascia'){ if (!f.classi.length || confirm(`Tolgo la fascia ${f.s}-${f.e} con le sue classi?`)) NG.fasce.splice(i, 1); }
  else if (a === 'addClasse') f.classi.push(ngNuovaClasse());
  else if (a === 'delClasse') f.classi.splice(k, 1);
  else if (a === 'step'){ const ol = ngMin(f.e) - ngMin(f.s); f[el.dataset.k] = ngOra(ngMin(f[el.dataset.k]) + Number(el.dataset.d)); if (el.dataset.k === 's' && ol > 0) f.e = ngOra(ngMin(f.s) + ol); }
  else if (a === 'anno') c.anno = v;
  else if (a === 'sez') c.sez = v;
  else if (a === 'esp'){ const q = c.esp.indexOf(v); if (q >= 0) c.esp.splice(q, 1); else if (c.esp.length < 3) c.esp.push(v); else { toast('Al massimo 3 esperimenti: togline uno prima.', true); return; } }
  else if (a === 'mano'){ c.man = true; if (!c.testo) c.testo = (c.anno || c.sez || c.esp.length) ? ngTestoGuidato(c) : ''; }
  else if (a === 'guidata') c.man = false;
  else return;
  ngRender();
});
document.addEventListener('change', e => {
  if (!NG) return;
  const t = e.target;
  if (t.dataset.ngtm){ const [i, k] = t.dataset.ngtm.split('|'); const f = NG.fasce[Number(i)]; if (!t.value) { ngRender(); return; } const ol = ngMin(f.e) - ngMin(f.s); f[k] = t.value; if (k === 's' && ol > 0) f.e = ngOra(ngMin(f.s) + ol); ngRender(); }
  else if (t.id === 'ngData'){ NG.data = t.value; ngRender(); }
  else if (t.id === 'ngScuolaSel'){
    NG.altra = t.value === '__altra';
    NG.scuola = NG.altra ? '' : t.value;
    if (!NG.altra && NG.scuola){ const o = ngOrdineScuola(NG.scuola); if (o) NG.ordine = o; }
    ngRender();
    if (NG.altra) document.getElementById('ngScuolaTxt').focus();
  }
});
document.addEventListener('input', e => {
  if (!NG) return;
  const t = e.target;
  if (t.id === 'ngNota') NG.nota = t.value;
  else if (t.id === 'ngScuolaTxt') NG.scuola = t.value;
  else if (t.dataset.ngtxt){ const [i, k] = t.dataset.ngtxt.split('|').map(Number); NG.fasce[i].classi[k].testo = t.value; }
});

/* ---------- collegamento sulla schermata Home ---------- */
let promptInstalla = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function aggiornaTastiInstalla(){
  document.querySelectorAll('[data-installa]').forEach(b => {
    const contenitore = b.closest('.login-installa') || b;
    contenitore.hidden = isStandalone();
  });
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptInstalla = e; aggiornaTastiInstalla(); });
window.addEventListener('appinstalled', () => { promptInstalla = null; aggiornaTastiInstalla(); toast('App installata: la trovi nella schermata Home.'); });
async function installa(){
  if (promptInstalla){
    promptInstalla.prompt();
    try { await promptInstalla.userChoice; } catch(e){}
    promptInstalla = null;
    return;
  }
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const android = /Android/.test(ua);
  const share = '<svg class="ico-share" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  let passi;
  if (ios) passi = `<ol>
      <li>Apri questa pagina con <b>Safari</b> (o Chrome).</li>
      <li>Tocca il pulsante <b>Condividi</b> ${share} (in basso, o in alto su iPad; in Chrome è in alto a destra).</li>
      <li>Scorri e scegli <b>Aggiungi alla schermata Home</b>, poi <b>Aggiungi</b>.</li></ol>`;
  else if (android) passi = `<ol>
      <li>Apri questa pagina con <b>Chrome</b>.</li>
      <li>Tocca il menu <b>⋮</b> in alto a destra.</li>
      <li>Scegli <b>Aggiungi a schermata Home</b> (o <b>Installa app</b>), poi conferma.</li></ol>`;
  else passi = `<ol>
      <li>In Chrome o Edge, clicca l'icona di installazione nella barra degli indirizzi (a destra) oppure apri il menu <b>⋮</b>.</li>
      <li>Scegli <b>Installa Turni</b> (o <b>App → Installa questo sito come app</b>).</li></ol>
      <p class="hint">Dal telefono: apri <b>www.classlab.it/turni</b> e premi di nuovo questo tasto.</p>`;
  apriModal(`<div class="guida"><h3>Aggiungi Turni alla schermata Home</h3>
    <p class="hint">Avrai un'icona ClassLab che apre direttamente il gestionale, come un'app.</p>${passi}
    <p class="hint">Se avevi già un'icona vecchia, eliminala prima e poi aggiungila di nuovo.</p>
    <div class="acts"><button class="btn primary" data-close>Ho capito</button></div></div>`);
}
aggiornaTastiInstalla();

/* ---------- eventi ---------- */
const unkey = k => { const [m,r,c,t,x] = k.split('|'); return [m, Number(r), Number(c), t, x]; };
const decode = s => s;

document.addEventListener('click', e => {
  const el = e.target.closest('[data-vista],[data-installa],[data-modg],[data-riprog],[data-tab],[data-prendi],[data-lascia],[data-posto],[data-txt],[data-coppia],[data-close],#nApri,#reload,#logout');
  // il modulo "Nuova giornata" si chiude solo con Annulla, per non perdere i dati con un clic fuori
  if (!el) { if (e.target.id === 'modalBg' && !NG) chiudiModal(); return; }
  if (el.id === 'nApri'){ modalNuovaGiornata(); return; }
  if (el.dataset.vista){ mostraVista(el.dataset.vista); return; }
  if (el.hasAttribute('data-installa')){ installa(); return; }
  if (el.dataset.tab){ S.tab = el.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (el.id === 'reload'){ carica(); return; }
  if (el.id === 'logout'){ esci(); return; }
  if (el.hasAttribute('data-close')){ chiudiModal(); return; }

  if (el.dataset.prendi){
    const [mat,r,c,t] = unkey(decode(el.dataset.prendi));
    const g = S.dati.giornate.find(x => x.materia === mat && x.data === el.dataset.day && x.turni.some(tt => tt.posti.some(p => p.riga===r && p.col===c)));
    const tr = g && g.turni.find(tt => tt.posti.some(p => p.riga===r && p.col===c));
    const conf = g && tr ? trovaConflitti(me(), {g, t: tr}).filter(x => x.extra) : [];
    const msg = conf.length ? `Hai già un turno sovrapposto (${conf[0].a} / ${conf[0].b}). Vuoi segnarti comunque?` : `Confermi di prendere il turno delle ${el.dataset.ora}?`;
    if (!confirm(msg)) return;
    azione('prendiPosto', [mat, r, c, t], 'Fatto! Il turno è tuo.');
    return;
  }
  if (el.dataset.lascia){
    const [mat,r,c,t] = unkey(decode(el.dataset.lascia));
    if (!confirm('Vuoi davvero lasciare questo turno? Il posto torna libero per gli altri.')) return;
    azione('lasciaPosto', [mat, r, c, t], 'Turno lasciato.');
    return;
  }
  if (el.dataset.posto){ const [m,r,c,t,tipo] = unkey(decode(el.dataset.posto)); modalPosto(m, r, c, t, tipo); return; }
  if (el.dataset.txt){ const [m,r,c,t,l] = unkey(decode(el.dataset.txt)); modalTesto(m, r, c, t, l); return; }
  if (el.dataset.modg){ const [m,r] = el.dataset.modg.split('|'); modalGiornata(m, Number(r)); return; }
  if (el.dataset.riprog){
    const [m,r,on] = el.dataset.riprog.split('|');
    const msg = on === '1' ? 'Segno questa giornata come DA RIPROGRAMMARE? I suoi posti non compariranno più tra quelli disponibili.' : 'La giornata è stata riprogrammata? Torna visibile con i suoi posti liberi.';
    if (confirm(msg)) azione('segnaRiprogrammare', [m, Number(r), on === '1'], on === '1' ? 'Giornata segnata da riprogrammare' : 'Giornata di nuovo attiva');
    return;
  }
  if (el.dataset.coppia){ const [m,r] = el.dataset.coppia.split('|'); if (confirm('Aggiungo una classe (due righe) in fondo a questa giornata?')) azione('aggiungiCoppia', [m, Number(r)], 'Classe aggiunta'); return; }
});
document.addEventListener('change', e => {
  if (e.target.id === 'persona'){ S.persona = e.target.value; render(); }
  if (e.target.id === 'materia'){ S.materia = e.target.value; render(); }
  if (e.target.id === 'passate'){ S.passate = e.target.checked; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !NG) chiudiModal(); });

avviaLogin();
</script>
