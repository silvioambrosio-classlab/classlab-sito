<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ultime modifiche · ClassLab</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14365f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icona-32.png?v=1">
<link rel="apple-touch-icon" href="icona-180.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ultime">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="../assets/fonts/montserrat-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  @font-face{font-family:"Montserrat";src:url("../assets/fonts/montserrat-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:swap}
  :root{--navy:#14365f;--blu:#0b77b8;--cielo:#e3f2fc;--arancio:#f29a2e;--bg:#f6f9fc;--ink:#0f172a;--testo:#334155;--muted:#64748b;--line:#e2e8f0;--bad:#b42318;--bad-bg:#fdecea;--ok:#2f7d3b;--r:16px}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--testo);font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;cursor:pointer}
  a{color:inherit}
  .hidden{display:none!important}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}

  #login,#negato{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card-c{background:#fff;border:1px solid var(--line);border-radius:22px;max-width:420px;width:100%;padding:32px 24px;text-align:center;box-shadow:0 10px 30px rgba(20,54,95,.08)}
  .card-c img{width:84px;height:84px;border-radius:20px}
  .card-c h1{font-size:22px;margin:14px 0 6px;color:var(--ink)}
  .card-c p{color:var(--muted);margin:0 0 22px}
  .card-c a{color:var(--blu);font-size:14px}
  #gbtn{display:flex;justify-content:center;min-height:44px}
  #loginErr{color:var(--bad);font-size:14px;margin-top:14px;min-height:1em}

  header.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top)}
  .bar{display:flex;align-items:center;gap:10px;padding:12px 16px}
  .bar h1{font-size:18px;margin:0;flex:1;color:#fff}
  .ib{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;min-width:40px;height:40px;padding:0 12px;font-size:14px}
  .ib:active{background:rgba(255,255,255,.28)}
  .ib svg{width:20px;height:20px;vertical-align:middle}
  .girando svg{animation:gira .8s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  main.wrap{padding-top:16px;padding-bottom:48px}
  .sotto{color:var(--muted);font-size:13px;margin:0 2px 14px}

  .hero{display:block;background:linear-gradient(135deg,var(--navy),#1d5a94);color:#fff;border-radius:22px;padding:22px 20px;text-decoration:none;box-shadow:0 12px 28px rgba(20,54,95,.25);margin-bottom:22px}
  .hero small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.8;font-weight:700}
  .hero h2{margin:6px 0 4px;font-size:21px;line-height:1.25;color:#fff;word-break:break-word}
  .hero p{margin:0 0 16px;opacity:.85;font-size:14px}
  .hero .vai{display:inline-flex;align-items:center;gap:8px;background:var(--arancio);color:#1d1100;font-weight:700;border-radius:999px;padding:11px 20px}
  .hero.vuoto{background:#fff;color:var(--muted);box-shadow:none;border:1px dashed var(--line)}

  h3.sez{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:26px 2px 10px}
  .blocco{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
  .blocco>header{display:flex;align-items:center;gap:10px;padding:14px 16px 4px}
  .blocco>header .ico{width:38px;height:38px;border-radius:12px;background:var(--cielo);color:var(--blu);display:grid;place-items:center;flex-shrink:0}
  .blocco>header .ico svg{width:21px;height:21px}
  .blocco>header h4{margin:0;font-size:16px;color:var(--ink);flex:1}
  .riga{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none}
  .riga:first-of-type{border-top:0}
  a.riga:active{background:var(--cielo)}
  .riga .t{flex:1;min-width:0}
  .riga .t b{display:block;color:var(--ink);font-size:14.5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
  .riga .t span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .riga .freccia{color:var(--blu);font-weight:700}
  .riga.nuova .t b::before{content:"ULTIMA";font-size:10px;background:var(--arancio);color:#1d1100;border-radius:6px;padding:2px 6px;margin-right:6px;vertical-align:1px;letter-spacing:.04em}
  .nota{padding:12px 16px 16px;color:var(--muted);font-size:13.5px}
  .nota.err{color:var(--bad);background:var(--bad-bg)}
  .piu{display:block;width:100%;border:0;border-top:1px solid var(--line);background:#fafcfe;color:var(--blu);padding:11px;font-weight:600;font-size:13.5px}

  .colleg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .colleg a{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-decoration:none;font-size:13.5px;font-weight:600;color:var(--ink)}
  .colleg a:active{background:var(--cielo)}
  .colleg svg{width:20px;height:20px;color:var(--blu);flex-shrink:0}
  #installa{margin-top:22px;text-align:center;font-size:13.5px;color:var(--muted)}
  #installa button{background:var(--navy);color:#fff;border:0;border-radius:999px;padding:11px 20px;font-weight:600}
  @media (max-width:360px){.colleg{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- Accesso -->
<div id="login" class="hidden">
  <div class="card-c">
    <img src="icona-192.png?v=1" alt="">
    <h1>Ultime modifiche</h1>
    <p>Area riservata ai gestori di ClassLab.<br>Accedi con il tuo account Google <b>@classlab.it</b>.</p>
    <div id="gbtn"></div>
    <div id="loginErr" aria-live="polite"></div>
  </div>
</div>

<!-- Accesso negato -->
<div id="negato" class="hidden">
  <div class="card-c">
    <img src="icona-192.png?v=1" alt="">
    <h1>Solo per i gestori</h1>
    <p id="negatoMsg">Questa app è riservata ai gestori (livello 1).</p>
    <p><a href="../area-team.html">Torna all'area team</a> · <a href="#" id="negatoEsci">Esci</a></p>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <header class="top">
    <div class="wrap bar">
      <h1>Ultime modifiche</h1>
      <button class="ib" id="aggiorna" type="button" aria-label="Aggiorna"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <button class="ib" id="esci" type="button">Esci</button>
    </div>
  </header>
  <main class="wrap">
    <p class="sotto" id="sotto"></p>
    <div id="hero"></div>

    <h3 class="sez">Sito</h3>
    <div class="blocco" id="b-sito"></div>

    <h3 class="sez">Cartelle Drive</h3>
    <div class="blocco" id="b-drive"></div>

    <h3 class="sez">Mail di prova</h3>
    <div class="blocco" id="b-mail"></div>

    <h3 class="sez">Collegamenti rapidi</h3>
    <div class="colleg" id="colleg"></div>
    <div id="installa" class="hidden"></div>
  </main>
</div>

<script src="../turni/config.js"></script>
<script src="../assets/js/team-auth.js"></script>
<script src="config.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var C = window.ULTIME_CONFIG || {};
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  // accetta solo indirizzi web, per non far eseguire mai javascript: o simili
  var sicuro = function (u) { u = String(u || ""); return /^https:\/\//i.test(u) ? u : "#"; };

  var ICO = {
    sito: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
    cartella: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    calendario: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    persone: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',
    codice: '<path d="m8 8-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/>'
  };
  var svg = function (k) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICO[k] || ICO.sito) + "</svg>"; };

  function fa(iso) {
    var d = new Date(iso), s = (Date.now() - d.getTime()) / 1000;
    if (isNaN(d)) return "";
    if (s < 60) return "adesso";
    if (s < 3600) return Math.floor(s / 60) + " min fa";
    if (s < 86400) return Math.floor(s / 3600) + (Math.floor(s / 3600) === 1 ? " ora fa" : " ore fa");
    if (s < 86400 * 2) return "ieri alle " + d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
    return d.toLocaleDateString("it-IT", { day: "numeric", month: "short" }) + " alle " + d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  }

  /* ---------- chiamate ---------- */
  function post(url, fn, args) {
    var tok = TeamAuth.token();
    if (!TeamAuth.valido(tok)) { TeamAuth.esci(); return Promise.reject(Object.assign(new Error("Sessione scaduta"), { auth: true })); }
    return fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ token: tok, fn: fn, args: args || [] }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) { var e = new Error(j.errore || "Errore"); e.auth = !!j.auth; throw e; } return j.dati; });
  }

  function gh(percorso) {
    return fetch("https://api.github.com/repos/" + C.REPO + percorso, { headers: { Accept: "application/vnd.github+json" } })
      .then(function (r) { if (!r.ok) throw new Error("GitHub " + r.status); return r.json(); });
  }

  /* ---------- sito ---------- */
  // da file modificato a pagina pubblica da aprire
  function paginaDi(files) {
    var sito = String(C.SITO || "").replace(/\/$/, "");
    var mappa = { "assets/js/laboratori-dati.js": "/laboratori.html", "assets/js/partner-dati.js": "/", "assets/js/config.js": "/", "assets/js/modulo.js": "/partecipa.html", "assets/js/area-team-dati.js": "/area-team.html" };
    for (var i = 0; i < files.length; i++) {
      var f = files[i].filename;
      if (mappa[f]) return sito + mappa[f];
      if (/^[^\/]+\.html$/.test(f)) return sito + "/" + (f === "index.html" ? "" : f);
      var m = f.match(/^(turni|materiali|permessi|ultime)\//); if (m) return sito + "/" + m[1] + "/";
    }
    return null;
  }

  function caricaSito() {
    return gh("/commits?per_page=6").then(function (lista) {
      var righe = lista.map(function (c) {
        return { titolo: (c.commit.message || "").split("\n")[0], data: c.commit.committer.date, url: c.html_url, sha: c.sha, sotto: "Pubblicata " + fa(c.commit.committer.date) };
      });
      // per la più recente cerco la pagina del sito che è cambiata
      return gh("/commits/" + lista[0].sha).then(function (d) {
        var p = paginaDi(d.files || []);
        if (p) righe[0].pagina = p;
        return righe;
      }, function () { return righe; });
    });
  }

  /* ---------- disegno ---------- */
  function righeHtml(righe, dettaglio) {
    return righe.map(function (r, i) {
      return '<a class="riga' + (i === 0 ? " nuova" : "") + '" href="' + esc(sicuro(r.url)) + '" target="_blank" rel="noopener"><span class="t"><b>' + esc(r.titolo) + "</b><span>" + esc(r.sotto || "") + '</span></span><span class="freccia">↗</span></a>';
    }).join("");
  }

  function blocco(id, icona, titolo, righe, nota, extra) {
    var el = $(id), html = '<header><span class="ico">' + svg(icona) + "</span><h4>" + esc(titolo) + "</h4></header>";
    if (nota) html += '<div class="nota' + (nota.err ? " err" : "") + '">' + esc(nota.testo) + "</div>";
    if (righe && righe.length) {
      html += righeHtml(righe.slice(0, 1)) + (extra || "");
      extra = null;
      if (righe.length > 1) {
        html += '<div class="altre hidden">' + righeHtml(righe.slice(1)).replace(/ nuova/g, "") + '</div><button class="piu" type="button">Mostra le precedenti (' + (righe.length - 1) + ")</button>";
      }
    }
    if (extra) html += extra;
    el.innerHTML = html;
    var b = el.querySelector(".piu");
    if (b) b.onclick = function () { el.querySelector(".altre").classList.toggle("hidden"); b.textContent = el.querySelector(".altre").classList.contains("hidden") ? "Mostra le precedenti (" + (righe.length - 1) + ")" : "Nascondi le precedenti"; };
  }

  var tutte = []; // ultime modifiche di ogni fonte, per il riquadro in alto

  function disegnaHero() {
    tutte.sort(function (a, b) { return new Date(b.data) - new Date(a.data); });
    var t = tutte[0];
    if (!t) { $("hero").innerHTML = '<div class="hero vuoto"><small>Ultima modifica</small><h2>Nessun dato ancora</h2></div>'; return; }
    $("hero").innerHTML = '<a class="hero" href="' + esc(sicuro(t.apri)) + '" target="_blank" rel="noopener"><small>Ultima modifica · ' + esc(t.fonte) + "</small><h2>" + esc(t.titolo) + "</h2><p>" + esc(fa(t.data)) + '</p><span class="vai">' + esc(t.azione) + " ↗</span></a>";
  }

  function carica() {
    $("aggiorna").classList.add("girando");
    tutte = [];
    var attese = [];

    attese.push(caricaSito().then(function (r) {
      var x = r[0];
      tutte.push({ fonte: "Sito", titolo: x.titolo, data: x.data, apri: x.pagina || x.url, azione: x.pagina ? "Apri la pagina" : "Apri su GitHub" });
      
      var extra = x.pagina ? '<a class="riga" href="' + esc(sicuro(x.pagina)) + '" target="_blank" rel="noopener"><span class="t"><b>Apri la pagina modificata</b><span>' + esc(x.pagina.replace(/^https:\/\//, "")) + '</span></span><span class="freccia">↗</span></a>' : "";
      blocco("b-sito", "sito", "Sito classlab.it", r, null, extra);
    }).catch(function () {
      blocco("b-sito", "sito", "Sito classlab.it", null, { testo: "Non riesco a leggere le modifiche da GitHub. Riprova tra poco.", err: true });
    }));

    if (!C.API_URL) {
      var n = { testo: "Per vedere qui l'ultima modifica, collega lo script (guida: GUIDA-ULTIME.md, passo 2). Intanto usa i collegamenti rapidi in fondo." };
      blocco("b-drive", "cartella", "Cartelle Drive", null, n);
      blocco("b-mail", "mail", "Mail di prova", null, n);
    } else {
      attese.push(post(C.API_URL, "ultime").then(function (d) {
        var dr = (d.drive || []).map(function (f) { return { titolo: f.nome, data: f.data, url: f.url, sotto: (f.cartella ? f.cartella + " · " : "") + fa(f.data) + (f.autore ? " · " + f.autore : "") }; });
        var ml = (d.mail || []).map(function (m) { return { titolo: m.oggetto || "(senza oggetto)", data: m.data, url: m.url, sotto: (m.tipo === "bozza" ? "Bozza" : "Inviata") + " · " + fa(m.data) + (m.a ? " · a " + m.a : "") }; });
        if (dr[0]) tutte.push({ fonte: "Drive", titolo: dr[0].titolo, data: dr[0].data, apri: dr[0].url, azione: "Apri il file" });
        if (ml[0]) tutte.push({ fonte: "Mail", titolo: ml[0].titolo, data: ml[0].data, apri: ml[0].url, azione: "Apri la mail" });
        blocco("b-drive", "cartella", "Cartelle Drive", dr, dr.length ? null : { testo: "Nessun file trovato nelle cartelle controllate." });
        blocco("b-mail", "mail", "Mail di prova", ml, ml.length ? null : { testo: "Nessuna bozza o mail recente trovata." });
      }).catch(function (e) {
        if (e.auth) return;
        var n = { testo: "Script non raggiungibile: " + e.message, err: true };
        blocco("b-drive", "cartella", "Cartelle Drive", null, n);
        blocco("b-mail", "mail", "Mail di prova", null, n);
      }));
    }

    return Promise.all(attese).then(function () {
      disegnaHero();
      $("sotto").textContent = "Aggiornato alle " + new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
      $("aggiorna").classList.remove("girando");
    });
  }

  /* ---------- accesso: solo gestori (livello 1) ---------- */
  function mostra(id) { ["login", "negato", "app"].forEach(function (x) { $(x).classList.toggle("hidden", x !== id); }); }

  function negato(msg) { $("negatoMsg").textContent = msg; mostra("negato"); }

  function entra(p) {
    // il livello lo decide il server dei turni (scheda "Ruoli"): qui non ci si fida del solo browser
    post(window.TURNI_CONFIG.API_URL, "chiSono").then(function (io) {
      if (!io || Number(io.livello) !== 1) { negato("Questa app è riservata ai gestori (livello 1)."); return; }
      mostra("app");
      carica();
    }, function (e) {
      if (e.auth) return;
      negato("Non riesco a verificare il tuo livello di accesso. Riprova tra poco.");
    });
  }

  $("aggiorna").onclick = carica;
  $("esci").onclick = function () { TeamAuth.esci(); };
  $("negatoEsci").onclick = function (e) { e.preventDefault(); TeamAuth.esci(); };
  document.addEventListener("visibilitychange", function () { if (!document.hidden && !$("app").classList.contains("hidden")) carica(); });

  $("colleg").innerHTML = (C.COLLEGAMENTI || []).map(function (c) {
    return '<a href="' + esc(sicuro(c.url)) + '" target="_blank" rel="noopener">' + svg(c.icona) + "<span>" + esc(c.nome) + "</span></a>";
  }).join("");

  TeamAuth.avvia({
    bottone: "gbtn",
    onLogin: function (msg) { mostra("login"); $("loginErr").textContent = msg || ""; },
    onAccesso: entra
  });

  /* ---------- installazione ---------- */
  var evento = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); evento = e;
    $("installa").innerHTML = '<button type="button" id="btnInstalla">Installa l\'app sul telefono</button>';
    $("installa").classList.remove("hidden");
    $("btnInstalla").onclick = function () { evento.prompt(); evento = null; $("installa").classList.add("hidden"); };
  });
  var iOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.navigator.standalone;
  if (iOS) { $("installa").textContent = "Su iPhone: tocca Condividi, poi «Aggiungi a Home»."; $("installa").classList.remove("hidden"); }

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function () {});
})();
</script>
</body>
</html>
